version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
