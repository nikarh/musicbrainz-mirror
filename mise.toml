# Development tools and tasks. Rust itself comes from rust-toolchain.toml.
[tools]
git-cliff = "2.14.2"
cargo-deny = "0.20.2"

[tasks.dev]
description = "Serve the newest dev-data/musicbrainz-*/ on 127.0.0.1:5000 without updates (mise run import builds one)"
run = "cargo run --release -- serve --data-dir dev-data --listen 127.0.0.1:5000 --update-schedule off"

[tasks.import]
description = "Build dev-data/musicbrainz-local from the archives or unpacked dumps given as arguments"
run = "cargo run --release -- import --out dev-data/musicbrainz-local"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks.lint]
description = "rustfmt check and clippy"
run = ["cargo fmt --check", "cargo clippy --locked --all-targets --all-features"]

[tasks.test]
description = "Run the tests"
run = "cargo test --locked"

[tasks.deny]
description = "Audit dependencies: advisories, licenses, duplicates, sources"
run = "cargo deny check"

[tasks.ci]
description = "What CI's check job runs: lint, tests, action pins"
depends = ["lint", "test"]
run = "scripts/check-actions.sh"

[tasks.check]
description = "Everything CI checks"
depends = ["ci", "deny"]

[tasks.build]
description = "Release build of the binary"
run = "cargo build --locked --release"

[tasks.docker]
description = "Build the container image as musicbrainz-mirror:dev"
run = "{{env.CONTAINER_ENGINE | default(value='docker')}} build -t musicbrainz-mirror:dev ."

[tasks.changelog]
description = "Print the changelog of the unreleased commits"
run = "git cliff --offline --unreleased"
