[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  # ring, rustls-webpki, untrusted (TLS)
  "ISC",
  # matchit (axum's router), subtle
  "BSD-3-Clause",
  # unicode-ident, the icu_* crates (URL handling): Unicode data
  "Unicode-3.0",
  # foldhash (hashbrown)
  "Zlib",
  # libbz2-rs-sys: the bzip2 decoder, a port of bzip2 under its own BSD-style license
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [{ crate = "syn@2.0.119", reason = "tracing-attributes still uses syn 2 (build time only)" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
